<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  * { box-sizing: border-box; }
  a { text-decoration: none; color: inherit; }
  ul { margin: 0; padding: 0; list-style: none; }
  body {
    font-family: ui-sans-serif, "Inter", "Segoe UI", system-ui, sans-serif;
    background: #000; color: #f2f2f5;
  }
  .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, monospace; }

  /* shared nav / footer, transparent so canvases show through */
  .topnav { display: flex; align-items: center; justify-content: space-between; padding: 20px 44px; position: relative; z-index: 5; pointer-events: none; }
  .topnav .logo { font-weight: 700; font-size: 15px; }
  .logo-btn { background: none; border: none; color: #fff; font-family: inherit; cursor: pointer; padding: 8px 10px; margin: -8px -10px; pointer-events: auto; }
  .logo-btn:hover { color: #9ad; }
  .fps-badge { position: fixed; bottom: 10px; right: 12px; z-index: 50; font: 11px/1.4 monospace; color: rgba(255,255,255,0.45); pointer-events: none; }
  .foot { position: relative; z-index: 5; padding: 20px 44px 34px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: #6b6b76; pointer-events: none; }
  .instr { text-align: center; font-family: ui-monospace, monospace; font-size: 11.5px; letter-spacing: .06em; color: #6b6b76; margin: 0 auto 18px; }

  /* ============================= VIEW C: TIDELINE ============================= */
  .vC { position: relative; min-height: 100vh; }
  #canvasC { position: fixed; inset: 0; z-index: 0; display: block; }
  .vC .hero { position: relative; z-index: 5; padding: 100px 24px 6px; text-align: center; pointer-events: none; }
  .vC .hero h1 { font-family: ui-monospace, monospace; font-size: 36px; line-height: 1.2; font-weight: 700; margin: 0 auto 12px; letter-spacing: -0.01em; max-width: 22ch; }
  .vC .hero p { font-size: 14.5px; color: #9a9aa6; max-width: 44ch; margin: 0 auto; }
  .vC .list { position: relative; z-index: 5; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 32px 24px 22px; pointer-events: none; }
  .vC .iconsBelow { padding: 0 24px 100px; }
  .vC .foot { justify-content: center; position: fixed; left: 0; right: 0; bottom: 0; }
  .vC .chip {
    font-family: ui-monospace, monospace; font-size: 12.5px; padding: 10px 16px; border-radius: 999px;
    border: 1px solid #262630; background: rgba(0,0,0,.55); color: #d6d6de; display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer; pointer-events: auto; text-decoration: none;
  }
  .vC .chip:hover { border-color: var(--c); color: #fff; }
  .vC .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .vC .chip .chipIcon { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; font-size: 14px; line-height: 1; color: var(--c); }
  .vC .chip .chipIcon svg { width: 100%; height: 100%; fill: var(--c); }
  .projectModal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
  .projectModal.open { opacity: 1; pointer-events: auto; }
  .projectModal .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(2px); }
  .projectModal .panel {
    position: relative; z-index: 1; width: 100%; max-width: 380px; background: #0c0c11; border: 1px solid #262630;
    border-radius: 14px; padding: 24px 24px 20px; font-family: ui-monospace, monospace; color: #d6d6de;
    transform: translateY(6px) scale(0.98); transition: transform 0.15s ease;
  }
  .projectModal.open .panel { transform: translateY(0) scale(1); }
  .projectModal .pmHead { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .projectModal .pmDot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .projectModal .pmName { font-size: 17px; font-weight: 700; color: #fff; }
  .projectModal .pmTag { font-size: 11.5px; color: var(--c); margin: 0 0 14px 18px; letter-spacing: 0.02em; }
  .projectModal .pmDesc { font-size: 13px; line-height: 1.55; color: #a8a8b3; margin: 0 0 18px; }
  .projectModal .pmVisit { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--c); text-decoration: none; border: 1px solid var(--c); border-radius: 999px; padding: 8px 14px; }
  .projectModal .pmVisit:hover { background: var(--c); color: #0c0c11; }
  .projectModal .pmClose { position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid #262630; background: transparent; color: #85858f; font-size: 14px; cursor: pointer; line-height: 1; }
  .projectModal .pmClose:hover { color: #fff; border-color: #454552; }
  .projectModal button.pmVisit { font: inherit; appearance: none; cursor: pointer; width: 100%; justify-content: center; transition: background 0.15s ease, color 0.15s ease; }
  .projectModal button.pmVisit.copied { background: var(--c); color: #0c0c11; }
  .projectModal .coinAddr {
    display: block; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.55; color: #d6d6de;
    background: #08080c; border: 1px solid #262630; border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; word-break: break-all;
  }
  .cmBtnRow { display: flex; gap: 8px; }
  .cmBtnRow .pmVisit { width: auto; flex: 1; }
  .cmQrWrap { display: flex; justify-content: center; margin: 0 0 14px; }
  .cmQrWrap canvas { display: block; width: 176px; height: 176px; border-radius: 8px; background: #fff; padding: 12px; }
  @media (max-width: 700px) {
    html, body { overflow-y: auto; }
    .vC .hero { padding: 60px 20px 6px; }
    .vC .hero h1 { font-size: 24px; }
    .vC .list { padding: 24px 16px 16px; gap: 8px; }
    .vC .iconsBelow { padding: 0 16px 70px; }
  }
</style>

(function () {

// QR Code Generator for JavaScript

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);

        var b2 = read();
        var b3 = read();

      var bytes = [];

        if (c < 128) {
          bytes.push(c);

    ehw: { name: 'Event Horizon Web', tag: 'AGPL-3.0 · event monitor', c: '#f5a524', href: 'https://event-horizon.fysh.site', desc: "Watches for events worth knowing about and surfaces them before you'd have found them yourself. Still rough at the edges. AGPL-3.0." },
    rr: { name: 'Red Rocket', tag: 'AGPL-3.0 · android', c: '#ef4444', href: 'https://redrocket.fysh.site', desc: 'An Android app, open source under AGPL-3.0. Download it at redrocket.fysh.site; source and releases live on GitHub.' },
    wg: { name: 'Warp Gate', tag: 'AGPL-3.0 · file transfer', c: '#8b5cf6', href: 'https://warpgate.fysh.site', desc: "Send files between your own devices without routing them through someone else's cloud. AGPL-3.0, self-hosted." }
  };
  var pmEl = document.getElementById('projectModal'), pmDot = document.getElementById('pmDot'),
    pmName = document.getElementById('pmName'), pmTag = document.getElementById('pmTag'),
    pmDesc = document.getElementById('pmDesc'), pmVisit = document.getElementById('pmVisit'),
    pmClose = document.getElementById('pmClose'), pmBackdrop = document.getElementById('pmBackdrop'),
    chipListC = document.getElementById('chipListC');
  function openProjectModal(key) {
    var p = PROJECTS_C[key];
    if (!p || !pmEl) return;
    pmEl.style.setProperty('--c', p.c);
    pmDot.style.background = p.c;
    pmName.textContent = p.name;
    pmTag.textContent = p.tag;
    pmDesc.textContent = p.desc;
    pmVisit.href = p.href;
    pmEl.classList.add('open');
  }
  function closeProjectModal() { if (pmEl) pmEl.classList.remove('open'); }
  function onChipClickC(e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    var key = btn.getAttribute('data-key');
    if (!key || !PROJECTS_C[key]) return;
    e.preventDefault();
    openProjectModal(key);
  }

  /* ---------- crypto address modal ---------- */
  var COINS_C = {
    xmr: { name: 'Monero', c: '#f26822', addr: '8Ahxk91aBHfCgLmqUji5NQXVHg9Y6pAj1EpdnsZvm5Nf4M4D9Uam6hr4FXZoBhNuZoKMH9V31pYZF6fkyf4pvK6q4pCmynj' },
    btc: { name: 'Bitcoin', c: '#f7931a', addr: 'bc1qkgq5xpue5se32xu53s4nuvn866u4xgpl0xs27t' }
  };
  var cmEl = document.getElementById('cryptoModal'), cmDot = document.getElementById('cmDot'),
    cmName = document.getElementById('cmName'), cmAddr = document.getElementById('cmAddr'),
    cmCopy = document.getElementById('cmCopy'), cmClose = document.getElementById('cmClose'),
    cmBackdrop = document.getElementById('cmBackdrop'), chipMonero = document.getElementById('chipMonero'),
    chipBitcoin = document.getElementById('chipBitcoin'), cmCopyResetT = null,
    cmQrWrap = document.getElementById('cmQrWrap'), cmQrCanvas = document.getElementById('cmQrCanvas'),
    cmQrToggle = document.getElementById('cmQrToggle'), cmQrDrawnFor = null;
  function openCryptoModal(key) {
    var c = COINS_C[key];
    if (!c || !cmEl) return;
    cmEl.style.setProperty('--c', c.c);
    cmDot.style.background = c.c;
    cmName.textContent = c.name;
    cmAddr.textContent = c.addr;
    cmAddr.dataset.key = key;
    cmCopy.textContent = 'Copy address';
    cmCopy.classList.remove('copied');
    if (cmQrWrap) cmQrWrap.setAttribute('hidden', '');
    if (cmQrToggle) cmQrToggle.textContent = 'Show QR';
    cmEl.classList.add('open');
  }
  function closeCryptoModal() { if (cmEl) cmEl.classList.remove('open'); }
  function onCoinCopyClick() {
    if (!navigator.clipboard) return;
    var text = cmAddr.textContent;
    navigator.clipboard.writeText(text).then(function () {
      cmCopy.textContent = 'Copied'; cmCopy.classList.add('copied');
      if (cmCopyResetT) clearTimeout(cmCopyResetT);
      cmCopyResetT = setTimeout(function () { cmCopy.textContent = 'Copy address'; cmCopy.classList.remove('copied'); }, 1800);
    }, function (err) { cmCopy.textContent = 'Copy failed: ' + err.message; });
  }
  function renderCoinQr(text) {
    var qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    var count = qr.getModuleCount(), cell = 5, margin = 4;
    var size = (count + margin * 2) * cell;
    cmQrCanvas.width = size; cmQrCanvas.height = size;
    var qctx = cmQrCanvas.getContext('2d');
    qctx.fillStyle = '#fff';
    qctx.fillRect(0, 0, size, size);
    qctx.fillStyle = '#0c0c11';
    for (var r = 0; r < count; r++) {
      for (var c2 = 0; c2 < count; c2++) {
        if (qr.isDark(r, c2)) qctx.fillRect((c2 + margin) * cell, (r + margin) * cell, cell, cell);
      }
    }
  }
  function onQrToggleClick() {
    if (!cmQrWrap) return;
    var isHidden = cmQrWrap.hasAttribute('hidden');
    if (isHidden) {
      var key = cmAddr.dataset.key;
      if (cmQrDrawnFor !== key) { renderCoinQr(cmAddr.textContent); cmQrDrawnFor = key; }
      cmQrWrap.removeAttribute('hidden');
      cmQrToggle.textContent = 'Hide QR';
    } else {
      cmQrWrap.setAttribute('hidden', '');
      cmQrToggle.textContent = 'Show QR';
    }
  }
  function onModalKeyC(e) { if (e.key === 'Escape') { closeProjectModal(); closeCryptoModal(); } }
  function onCoinMoneroClick() { openCryptoModal('xmr'); }
  function onCoinBitcoinClick() { openCryptoModal('btc'); }
  function startTidelineC() {
    if (loops.c) return;
    sizeC();
    window.addEventListener('resize', resizeC);
    window.addEventListener('click', onClickC);
    window.addEventListener('keydown', onModalKeyC);
    canvasC.addEventListener('mousedown', onIslDownC);
    window.addEventListener('mousemove', onIslMoveC);
    window.addEventListener('mouseup', onIslUpC);
    if (fishLogoC) fishLogoC.addEventListener('click', onFishLogoClick);
    if (chipListC) chipListC.addEventListener('click', onChipClickC);
    if (pmClose) pmClose.addEventListener('click', closeProjectModal);
    if (pmBackdrop) pmBackdrop.addEventListener('click', closeProjectModal);
    if (chipMonero) chipMonero.addEventListener('click', onCoinMoneroClick);
    if (chipBitcoin) chipBitcoin.addEventListener('click', onCoinBitcoinClick);
    if (cmCopy) cmCopy.addEventListener('click', onCoinCopyClick);
    if (cmQrToggle) cmQrToggle.addEventListener('click', onQrToggleClick);
    if (cmClose) cmClose.addEventListener('click', closeCryptoModal);
    if (cmBackdrop) cmBackdrop.addEventListener('click', closeCryptoModal);
    if (reduced) { drawTideFrame(); } else { loopC(); }
  }
  function stopTidelineC() {
    if (loops.c) { cancelAnimationFrame(loops.c); loops.c = null; }
    window.removeEventListener('resize', resizeC);
    window.removeEventListener('click', onClickC);
    window.removeEventListener('keydown', onModalKeyC);
    canvasC.removeEventListener('mousedown', onIslDownC);
    window.removeEventListener('mousemove', onIslMoveC);
    window.removeEventListener('mouseup', onIslUpC);
    if (fishLogoC) fishLogoC.removeEventListener('click', onFishLogoClick);
    if (chipListC) chipListC.removeEventListener('click', onChipClickC);
    if (pmClose) pmClose.removeEventListener('click', closeProjectModal);
    if (pmBackdrop) pmBackdrop.removeEventListener('click', closeProjectModal);
    if (chipMonero) chipMonero.removeEventListener('click', onCoinMoneroClick);
    if (chipBitcoin) chipBitcoin.removeEventListener('click', onCoinBitcoinClick);
    if (cmCopy) cmCopy.removeEventListener('click', onCoinCopyClick);
    if (cmQrToggle) cmQrToggle.removeEventListener('click', onQrToggleClick);
    if (cmClose) cmClose.removeEventListener('click', closeCryptoModal);
    if (cmBackdrop) cmBackdrop.removeEventListener('click', closeCryptoModal);
    dragIsl = null;
    closeProjectModal();
    closeCryptoModal();
    if (cmCopyResetT) { clearTimeout(cmCopyResetT); cmCopyResetT = null; }
    fpsLastT = 0;
    if (fpsElC) fpsElC.textContent = '';
  }

  startTidelineC();
})();
</script>
</body>
</html>
